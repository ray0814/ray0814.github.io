<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣本島 8x8 網格 — 右上角為原點 (Leaflet)</title>
    <link rel="stylesheet" href="css/leaflet.css" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0
        }

        #map {
            min-height: 360px
        }

        .grid-label {
            font-weight: 700;
            padding: 2px 4px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 3px;
            font-size: 12px
        }

        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000
        }

        .legend {
            position: absolute;
            right: 10px;
            top: 10px;
            z-index: 1000;
            background: white;
            padding: 6px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2)
        }

        @media (max-width:600px) {
            #map {
                height: 100vh
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="legend" id="legend">標註模式：<strong id="mode">座標 (x,y)</strong></div>

    <script src="js/leaflet-1.9.3.js"></script>
    <script>
        // ======== 可編輯的參數 ========
        const BBOX = { west: 120.03516303782406, east: 122.00706917693259, south: 21.89550391268821, north: 25.29966186182555 };
        const COLS = 8; // 水平方向切分數
        const ROWS = 8; // 垂直方向切分數
        // === 座標系統 ===
        // 右上角為原點 (1,1)，x 向左增至 8，y 向下增至 8。
        // ============================

        const map = L.map('map', { zoomControl: true }).fitBounds([[BBOX.south, BBOX.west], [BBOX.north, BBOX.east]]);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const gridLayer = L.layerGroup().addTo(map);

        const lonStep = (BBOX.east - BBOX.west) / COLS;
        const latStep = (BBOX.north - BBOX.south) / ROWS;

        let index = 1;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const latTop = BBOX.north - r * latStep;
                const latBottom = BBOX.north - (r + 1) * latStep;
                const lonLeft = BBOX.west + c * lonStep;
                const lonRight = BBOX.west + (c + 1) * lonStep;

                const bounds = [[latBottom, lonLeft], [latTop, lonRight]];
                const rect = L.rectangle(bounds, { color: '#3388ff', weight: 1, fill: true, fillOpacity: 0.05 });

                // (x,y) from 1..8
                const x = COLS - c;
                const y = r + 1;

                const coordLabel = `(${x},${y})`;
                const id = `R${r + 1}C${c + 1}`;

                const info = {
                    index: index,
                    id: id,
                    coord: { x: x, y: y },
                    bounds: { south: latBottom, north: latTop, west: lonLeft, east: lonRight }
                };

                rect.bindTooltip(`<div class=\"grid-label\">${coordLabel}</div>`, { permanent: false });

                rect.on('mouseover', () => rect.setStyle({ weight: 2, fillOpacity: 0.15 }).bringToFront());
                rect.on('mouseout', () => rect.setStyle({ weight: 1, fillOpacity: 0.05 }));

                rect.on('click', (e) => {
                    const b = info.bounds;
                    const content = `#${info.index} ${info.id} — 座標: (${info.coord.x},${info.coord.y})<br>` +
                        `南: ${b.south.toFixed(6)}<br>北: ${b.north.toFixed(6)}<br>西: ${b.west.toFixed(6)}<br>東: ${b.east.toFixed(6)}`;
                    rect.bindPopup(content).openPopup(e.latlng);
                });

                rect.addTo(gridLayer);
                index++;
            }
        }

        // 中心標籤 (x,y)
        const labels = L.layerGroup().addTo(map);
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const lat = BBOX.north - (r + 0.5) * latStep;
                const lon = BBOX.west + (c + 0.5) * lonStep;
                const x = COLS - c;
                const y = r + 1;
                const text = `(${x},${y})`;
                L.marker([lat, lon], { interactive: false, keyboard: false, opacity: 0.95 })
                    .bindTooltip(text, { permanent: true, direction: 'center', className: 'grid-label' })
                    .addTo(labels);
            }
        }

        // 控制項
        const ControlBox = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'controls leaflet-bar');
                container.style.background = 'white';
                container.style.padding = '6px';

                const btnToggle = L.DomUtil.create('a', '', container);
                btnToggle.innerHTML = '切換格子顯示';
                btnToggle.href = '#';
                btnToggle.style.display = 'block';
                btnToggle.style.padding = '4px 8px';

                const btnFit = L.DomUtil.create('a', '', container);
                btnFit.innerHTML = '回到台灣範圍';
                btnFit.href = '#';
                btnFit.style.display = 'block';
                btnFit.style.padding = '4px 8px';

                const btnExport = L.DomUtil.create('a', '', container);
                btnExport.innerHTML = '匯出 GeoJSON';
                btnExport.href = '#';
                btnExport.style.display = 'block';
                btnExport.style.padding = '4px 8px';

                L.DomEvent.disableClickPropagation(container);

                L.DomEvent.on(btnToggle, 'click', (ev) => {
                    L.DomEvent.stop(ev);
                    if (map.hasLayer(gridLayer)) map.removeLayer(gridLayer); else map.addLayer(gridLayer);
                });

                L.DomEvent.on(btnFit, 'click', (ev) => {
                    L.DomEvent.stop(ev);
                    map.fitBounds([[BBOX.south, BBOX.west], [BBOX.north, BBOX.east]]);
                });

                L.DomEvent.on(btnExport, 'click', (ev) => {
                    L.DomEvent.stop(ev);
                    const features = [];
                    gridLayer.eachLayer((layer, i) => {
                        if (!layer.getBounds) return;
                        const b = layer.getBounds();
                        const coords = [
                            [b.getWest(), b.getSouth()],
                            [b.getEast(), b.getSouth()],
                            [b.getEast(), b.getNorth()],
                            [b.getWest(), b.getNorth()],
                            [b.getWest(), b.getSouth()]
                        ];
                        const r = Math.floor(i / COLS);
                        const c = i % COLS;
                        const x = COLS - c;
                        const y = r + 1;
                        const id = `R${r + 1}C${c + 1}`;
                        features.push({ type: 'Feature', properties: { index: i + 1, id: id, x: x, y: y }, geometry: { type: 'Polygon', coordinates: [coords] } });
                    });
                    const geojson = { type: 'FeatureCollection', features: features };
                    const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const now = new Date();
                    const pad = (n) => String(n).padStart(2, '0');
                    const filename = `taiwan_grid_${ROWS}x${COLS}_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}.geojson`;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                });

                return container;
            }
        });

        map.addControl(new ControlBox());
        map.setMaxBounds([[BBOX.south - 1, BBOX.west - 1], [BBOX.north + 1, BBOX.east + 1]]);

        console.log('已建立右上為原點的 8x8 網格，座標為 (1..8,1..8)，x 向左增、y 向下增。');
    </script>
</body>

</html>
