<html>
  <head>
    <link rel="stylesheet" href="../css/leaflet.css" />
    <!-- <script src="js/leaflet.js" defer></script> -->
    <script src="../js/leaflet-1.9.3.js"></script>
    <!-- <script src="js/leaflet-gpx.js" defer></script> -->
    <script src="../js/leaflet-gpx-2.2.0.js"></script>
    <style>
      #map { height: 500px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- ... -->
    <script type="module">
      const map = L.map('map');


      L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}.jpeg').addTo(map);

      // URL to your GPX file or the GPX itself as a XML string.
      const url = 'gpxs/0909山搜統整路線.gpx';
      const options = {
        async: true,
        polyline_options: { color: 'red' },
      };

      const gpx = new L.GPX(url, options).on('loaded', (e) => {
        map.fitBounds(e.target.getBounds());
      }).addTo(map);
     </script>
  </body>
</html>
